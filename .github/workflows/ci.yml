name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dogfood on the fixture app
        run: |
          node bin/antra.js doctor tests/fixtures/rules-app
          node bin/antra.js scan tests/fixtures/rules-app --no-store --format sarif --output reports/rules-app.sarif
          node bin/antra.js scan tests/fixtures/rules-app --no-store --format json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const r = JSON.parse(s);
              if (r.findings.length === 0) { console.error("fixture produced no findings"); process.exit(1); }
              console.log(`${r.findings.length} findings, ${r.edges.length} edges`);
            });'
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: rules-app-sarif
          path: reports/rules-app.sarif

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
