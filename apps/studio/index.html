<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>antra studio</title>
    <link rel="icon" type="image/png" href="/antra.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bg-studio-theme");
          var dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
